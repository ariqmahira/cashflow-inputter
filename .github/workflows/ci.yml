name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Covers the migration pipeline, the cycle and budget arithmetic, and the database
      # schema. The schema tests run real Postgres in-process via pglite, so CI needs no
      # database service.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Public by design — these are compiled into the client bundle. The secret and
          # service-role keys must never appear here.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
